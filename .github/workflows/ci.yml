# Continuous integration. No job ever calls a model: the Python tests use a
# fake model client, and the eval replay answers from committed cassettes.
#
# Jobs:
#   go         build, vet, gofmt and the tests, the db package against Postgres
#   python     ruff, the full pytest suite against Postgres (the check that no
#              committed file cites the local planning notes is one of its
#              tests), then the fault check on its own so its counts show
#   frontend   eslint, the unit tests, the production build and an audit of the runtime dependencies
#   eval-replay  the document and prompt-injection evals replayed from
#              scripts/evals/cassettes/;
#              skipped until a live run has recorded and committed cassettes

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The admin connection the Go and Python suites use to create and drop
  # their own throwaway databases (med_sum_test_go, med_sum_test_py).
  MEDSUM_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
  # Database tests fail instead of skipping when Postgres is missing.
  MEDSUM_REQUIRE_DB: "1"

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: psql is on PATH (the db tests load the schema with it)
        run: psql --version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: Test
        run: go test ./...

  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: scripts
    steps:
      # The default checkout keeps .git, which the plan-reference test needs
      # for `git ls-files`.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Pytest
        run: pytest -q
      - name: Fault check (the validators against injected faults, no model)
        working-directory: scripts/src
        run: python -m evals.faultcheck --out "$RUNNER_TEMP/faultcheck"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit the runtime dependencies
        # Fails on a high or critical advisory in what the browser loads;
        # dev-only tools and lower severities are left to a person to weigh.
        run: npm audit --omit=dev --audit-level=high

  eval-replay:
    # Cassettes are written by the first live eval run and committed with its
    # report. Until then there is nothing to replay: the first step says so
    # and the others are skipped. (hashFiles works only in a step's `if`,
    # not a job's, so the check is a step.)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Where the runner creates and drops its throwaway med_sum_evals.
      MEDSUM_EVAL_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: scripts/src
    steps:
      - uses: actions/checkout@v4
      - name: Look for cassettes
        id: cassettes
        working-directory: .
        run: |
          if ls scripts/evals/cassettes/*/*.json >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cassettes yet: the first live eval run records them. Nothing to replay."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.cassettes.outputs.found == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        if: steps.cassettes.outputs.found == 'true'
        working-directory: scripts
        run: pip install -r requirements.txt
      - name: Replay the document evals from the cassettes
        if: steps.cassettes.outputs.found == 'true'
        # Exit 2 when a cassette is missing or no longer matches its request
        # (a changed prompt, page, option or schema), or was recorded with
        # another model build than the latest history entry names:
        # re-record, then commit.
        run: python -m evals.run --replay --label ci-replay --out "$RUNNER_TEMP/replay"
      - name: Replay the prompt-injection eval from its cassettes
        if: steps.cassettes.outputs.found == 'true'
        run: |
          if ! ls ../evals/cassettes/injection/*/*.json >/dev/null 2>&1; then
            echo "No injection cassettes yet."; exit 0
          fi
          python -m evals.injection --replay --label ci-injection --out "$RUNNER_TEMP/injection"
      - name: Compare with the latest committed live run
        if: steps.cassettes.outputs.found == 'true'
        # Fails when unsafe errors rise or the routing or recall measures
        # fall beyond the tolerances in evals/compare.py.
        run: |
          latest="$(ls ../evals/history/*.json 2>/dev/null | sort | tail -n 1)"
          if [ -z "$latest" ]; then
            echo "No committed history entry to compare with."; exit 0
          fi
          python -m evals.compare "$latest" "$RUNNER_TEMP/replay/report.json"
